/* Nattevagt: the bridge at night. One deliberate dark theme.
   Layout: a single phone-width column (max 520px) for players; a two-pane bridge for the table screen. */
:root {
  color-scheme: dark;
  --night: #06131c;
  --deck: #0a1e29;
  --deck2: #0d2633;
  --rail: #173a4c;
  --rail2: #22536b;
  --ink: #d6eaf1;
  --mute: #8bb1bf;
  --dim: #5a7d8d;
  --amber: #ffb347;
  --amber-ink: #1f1405;
  --ember: #ff8a3c;
  --sonar: #3fd6cc;
  --alarm: #ff3b3b;
  --water: #0a2633;
  --display: "Oxanium", "Avenir Next Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Barlow Semi Condensed", "Avenir Next Condensed", "Arial Narrow", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--night); color: var(--ink); }
body {
  font-family: var(--body); font-size: 16px; line-height: 1.4; font-weight: 500;
  -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased;
  background:
    radial-gradient(120% 60% at 50% -10%, rgba(63, 214, 204, 0.07), transparent 60%),
    radial-gradient(90% 50% at 50% 110%, rgba(255, 179, 71, 0.05), transparent 60%),
    var(--night);
  background-attachment: fixed;
}
button { font: inherit; color: inherit; touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.mono { font-family: var(--mono); font-feature-settings: "tnum" 1; font-variant-numeric: tabular-nums; }
.muted { color: var(--mute); }
.small { font-size: 14px; }
.tiny { font-size: 12px; }
.warn { color: var(--amber); }
[hidden] { display: none !important; }

#app { max-width: 520px; margin: 0 auto; padding: 8px 16px 96px; padding-top: max(8px, env(safe-area-inset-top)); }
#app.screen-table { max-width: none; padding: 16px 24px; }

/* type */
.h2 { font-family: var(--display); font-weight: 700; font-size: 24px; letter-spacing: 0.02em; margin: 14px 0 4px; text-wrap: balance; }
.h3 { font-family: var(--display); font-weight: 600; font-size: 15px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--mute); margin: 22px 0 8px; }
.h4 { font-family: var(--display); font-weight: 600; font-size: 16px; letter-spacing: 0.04em; margin: 16px 0 4px; color: var(--amber); }
.lbl { font-family: var(--display); font-weight: 600; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--mute); margin: 14px 0 6px; }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: 0.18em; color: var(--sonar); text-transform: uppercase; }
.logo { font-family: var(--display); font-weight: 700; letter-spacing: 0.08em; margin: 0; line-height: 1; }
.logo.sm { font-size: 18px; color: var(--amber); }

/* buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 46px; padding: 10px 16px; border-radius: 10px;
  background: var(--deck2); border: 1px solid var(--rail2); color: var(--ink);
  font-family: var(--display); font-weight: 600; letter-spacing: 0.04em; cursor: pointer;
}
.btn:hover:not(:disabled) { border-color: var(--mute); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.primary { background: var(--amber); color: var(--amber-ink); border-color: var(--amber); }
.btn.big { width: 100%; min-height: 56px; font-size: 19px; letter-spacing: 0.08em; text-transform: uppercase; margin-top: 18px; }
.btn.small { min-height: 38px; padding: 6px 12px; font-size: 14px; }
.btn.quiet { background: transparent; }
.btn.danger { color: #ff8f8f; border-color: #5a2630; }
.btn .ic { width: 18px; height: 18px; display: inline-flex; }
.btn .ic svg { width: 100%; height: 100%; }
.link { background: none; border: 0; padding: 6px 2px; color: var(--mute); font-family: var(--display); font-weight: 600; letter-spacing: 0.04em; cursor: pointer; }
.link:hover { color: var(--ink); }
.link.small { font-size: 13px; }
.link.danger { color: #ff8f8f; }
.iconbtn { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--rail); background: var(--deck); color: var(--mute); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; flex: 0 0 auto; }
.iconbtn svg { width: 20px; height: 20px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 14px; }

/* segmented control */
.seg { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; border-radius: 10px; background: var(--deck); border: 1px solid var(--rail); }
.seg button { flex: 1 1 auto; min-height: 36px; padding: 6px 10px; border-radius: 7px; border: 0; background: transparent; color: var(--mute); font-family: var(--display); font-weight: 600; cursor: pointer; }
.seg button.on { background: var(--rail2); color: var(--ink); }
.seg.ro button:disabled { opacity: 0.35; }

/* ---------- home ---------- */
.home { display: flex; flex-direction: column; gap: 18px; padding-top: 8px; }
.hero { position: relative; height: min(62vw, 330px); border-radius: 18px; overflow: hidden; border: 1px solid var(--rail); background: radial-gradient(circle at 50% 52%, #0c2a38 0%, #071722 70%); }
.radar { position: absolute; inset: 0; width: 100%; height: 100%; }
.brand { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px; background: linear-gradient(transparent, rgba(6, 19, 28, 0.92) 55%); }
.brand .logo { font-size: clamp(52px, 17vw, 84px); color: var(--ink); text-shadow: 0 0 28px rgba(63, 214, 204, 0.25); }
.tagline { margin: 8px 0 0; color: var(--mute); font-size: 17px; max-width: 34ch; }
.practiceLbl { font-family: var(--display); font-weight: 600; color: var(--amber); letter-spacing: 0.06em; }
.homeActions { display: flex; flex-direction: column; gap: 10px; }
.homeActions .btn.big { margin-top: 0; }
.joinRow { display: flex; gap: 8px; }
.codein { flex: 1; min-width: 0; min-height: 50px; border-radius: 10px; border: 1px solid var(--rail2); background: var(--deck); color: var(--ink); padding: 8px 14px; font-family: var(--mono); font-size: 22px; letter-spacing: 0.35em; text-transform: uppercase; }
.codein::placeholder { color: var(--dim); letter-spacing: 0.2em; font-size: 15px; }
.homeLinks { display: flex; justify-content: space-between; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.note { margin: 10px 0; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--rail); background: var(--deck); font-size: 14px; }

/* ---------- profile ---------- */
.profile { padding-top: 4px; }
.topline { display: flex; justify-content: space-between; align-items: center; }
.textin { width: 100%; min-height: 48px; border-radius: 10px; border: 1px solid var(--rail2); background: var(--deck); color: var(--ink); padding: 8px 12px; font-family: var(--body); font-size: 18px; font-weight: 500; }
.swatches { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; }
.sw { aspect-ratio: 1; max-width: 100%; border-radius: 10px; border: 2px solid transparent; background: var(--pc); cursor: pointer; position: relative; padding: 0; }
.sw.on { border-color: var(--ink); box-shadow: 0 0 0 3px var(--night) inset; }
.sw.taken { opacity: 0.3; }
.ships { display: flex; flex-direction: column; gap: 8px; }
.shiprow { display: flex; align-items: center; gap: 8px; }
.shiprow .textin { font-size: 16px; min-height: 44px; }
.len { display: inline-flex; gap: 2px; flex: 0 0 auto; }
.len i { width: 7px; height: 12px; border-radius: 2px; background: var(--mute); display: block; }

/* ---------- waiting ---------- */
.waiting { min-height: 70vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; }
.sweep { width: 120px; height: 120px; border-radius: 50%; border: 1px solid var(--rail2); background: conic-gradient(from 0deg, rgba(63, 214, 204, 0.4), transparent 30%); animation: spin 1.6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.errmsg { font-size: 18px; max-width: 32ch; }

/* ---------- bar and captains ---------- */
.bar { display: flex; align-items: center; gap: 10px; min-height: 44px; }
.bar .code { font-size: 15px; letter-spacing: 0.3em; color: var(--amber); }
.bar .round { font-size: 13px; color: var(--mute); }
.bar .menu { margin-left: auto; }
.wxstrip { display: flex; align-items: baseline; gap: 8px; padding: 6px 12px; margin: 2px 0 6px; border-radius: 10px; border: 1px solid rgba(255, 179, 71, 0.45); background: rgba(255, 179, 71, 0.06); font-size: 14px; min-width: 0; }
.wxstrip .wl { font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--mute); flex: 0 0 auto; }
.wxstrip .wn { font-family: var(--display); font-weight: 700; color: var(--amber); flex: 0 0 auto; }
.wxstrip .wd { color: var(--mute); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wxstrip.now { background: var(--amber); border-color: var(--amber); }
.wxstrip.now .wl, .wxstrip.now .wn, .wxstrip.now .wd { color: var(--amber-ink); }
.botpen { border-radius: 2px; }
.pill { display: inline-flex; align-items: center; min-height: 26px; padding: 2px 10px; border-radius: 999px; font-family: var(--display); font-weight: 600; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 48vw; }
.pill.fc { color: var(--amber); border: 1px solid rgba(255, 179, 71, 0.5); }
.pill.now { color: var(--amber-ink); background: var(--amber); }
.caps { display: grid; grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); gap: 6px; margin: 4px 0 10px; }
.cap { position: relative; min-width: 0; padding: 7px 9px 8px; border-radius: 10px; background: var(--deck); border: 1px solid var(--rail); overflow: hidden; }
.cap.me { border-color: var(--rail2); }
.cap.turn { border-color: var(--amber); box-shadow: 0 0 0 1px var(--amber) inset, 0 0 18px rgba(255, 179, 71, 0.18); }
.cap.ghost .nm, .cap.gone .nm { opacity: 0.6; text-decoration: line-through; text-decoration-color: rgba(214, 234, 241, 0.4); }
.cap.away { opacity: 0.6; }
.capTop { display: flex; align-items: center; gap: 6px; min-width: 0; }
.pen { width: 10px; height: 10px; border-radius: 50%; background: var(--pc); box-shadow: 0 0 10px var(--pc); flex: 0 0 auto; display: inline-block; }
.cap .nm { font-family: var(--display); font-weight: 700; font-size: clamp(12.5px, 3.5vw, 14px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.tag { font-family: var(--mono); font-size: 10px; padding: 1px 5px; border-radius: 4px; background: var(--rail); color: var(--mute); flex: 0 0 auto; }
.capMeta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 7px; margin-top: 4px; font-size: 12px; color: var(--mute); }
.scr { display: inline-flex; align-items: center; gap: 3px; color: var(--ink); }
.nut { width: 12px; height: 12px; display: inline-flex; color: var(--amber); }
.nut svg { width: 100%; height: 100%; }
.pips { display: inline-flex; gap: 3px; align-items: center; }
.pips i { display: block; height: 6px; border-radius: 2px; background: var(--mute); }
.pips i.l2 { width: 9px; } .pips i.l3 { width: 14px; } .pips i.l4 { width: 19px; }
.pips i.sunk { background: transparent; border: 1px solid #ff8a3c; opacity: 0.8; }
.owe { color: var(--amber-ink); background: var(--amber); border-radius: 4px; padding: 0 5px; font-weight: 700; }
.owe.bund { background: var(--alarm); color: #fff; }
.st { color: var(--sonar); }
.tbar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255, 179, 71, 0.15); }
.tbar i { display: block; height: 100%; width: 100%; background: var(--amber); transition: width 0.25s linear; }
.tbar.low i { background: var(--alarm); }
.caps.big { grid-template-columns: 1fr 1fr; }
.caps.big .cap { padding: 12px; }
.caps.big .nm { font-size: 20px; }
.caps.big .capMeta { font-size: 14px; }

/* ---------- ocean ---------- */
.oceanWrap { display: grid; grid-template-columns: 16px 1fr; grid-template-rows: 16px auto; gap: 3px; width: min(100%, calc(100vh - 330px)); width: min(100%, calc(100dvh - 330px)); min-width: min(100%, 280px); margin: 0 auto; }
.screen-table .oceanWrap { width: min(100%, calc(100vh - 140px)); grid-template-columns: 22px 1fr; grid-template-rows: 22px auto; }
.cols, .rows { display: grid; color: var(--dim); font-size: 11px; text-align: center; align-items: center; }
.screen-table .cols, .screen-table .rows { font-size: 15px; }
.cols { grid-template-columns: repeat(var(--nn, 9), 1fr); grid-column: 2; }
.rows { grid-template-rows: repeat(var(--nn, 9), 1fr); grid-row: 2; }
.ocean { grid-column: 2; grid-row: 2; position: relative; aspect-ratio: 1; width: 100%; border-radius: 12px; overflow: hidden; background: #3d5866; border: 1px solid var(--rail2); box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(0, 0, 0, 0.4) inset; }
.ocean.mineTurn { border-color: rgba(255, 179, 71, 0.6); }
.fogcv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.grid { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(var(--n), 1fr); grid-template-rows: repeat(var(--n), 1fr); gap: 2px; padding: 2px; }
.fxl { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.cell { position: relative; border: 0; padding: 0; margin: 0; border-radius: 4px; background: transparent; box-shadow: inset 0 0 0 1px rgba(6, 19, 28, 0.28); cursor: default; overflow: hidden; min-width: 0; min-height: 0; }
.cell svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.cell.tap { cursor: pointer; }
.cell.tap:hover { box-shadow: inset 0 0 0 2px rgba(255, 179, 71, 0.55); }
.cell.water { background: var(--water); box-shadow: inset 0 0 0 1px rgba(63, 214, 204, 0.05); }
.cell.hit { background: #24120b; }
.cell.wreck { background: #0b1d26; }
.cell.last { box-shadow: inset 0 0 0 2px rgba(255, 179, 71, 0.6); }
.cell.own { background: rgba(6, 19, 28, 0.35); }
.cell.sel { background: rgba(255, 179, 71, 0.18); }
.cell.bad { background: rgba(255, 59, 59, 0.35); }
.cell.ghostok { background: rgba(63, 214, 204, 0.35); }
.cell.ghostbad { background: rgba(255, 59, 59, 0.35); }
.cell.aim::after, .cell.aimBlock::after, .cell.aimLine::after { content: ""; position: absolute; inset: 2px; border-radius: 3px; pointer-events: none; }
.cell.aim::after { inset: 4px; border: 3px solid var(--amber); border-radius: 2px; clip-path: polygon(0 0, 35% 0, 35% 12%, 12% 12%, 12% 35%, 0 35%, 0 65%, 12% 65%, 12% 88%, 35% 88%, 35% 100%, 65% 100%, 65% 88%, 88% 88%, 88% 65%, 100% 65%, 100% 35%, 88% 35%, 88% 12%, 65% 12%, 65% 0, 100% 0, 100% 100%, 0 100%); animation: aimPulse 1s ease-in-out infinite; }
.cell.aimLine::after, .cell.aimBlock::after { background: rgba(255, 179, 71, 0.28); border: 1px solid rgba(255, 179, 71, 0.6); }
.cell.aimArea { box-shadow: inset 0 0 0 2px rgba(63, 214, 204, 0.75); background-color: rgba(63, 214, 204, 0.12); }
.cell.pinged { box-shadow: inset 0 0 0 1px rgba(63, 214, 204, 0.55); }
.sonarNum { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: clamp(16px, 5vw, 26px); font-weight: 700; color: #06131c; background: var(--sonar); border-radius: 50%; margin: 18%; box-shadow: 0 0 16px rgba(63, 214, 204, 0.8); }
.cell.flare { box-shadow: inset 0 0 0 3px #ff4d6d; background: rgba(255, 77, 109, 0.3); animation: flare 0.8s ease-in-out infinite alternate; }
@keyframes aimPulse { 50% { opacity: 0.55; } }
@keyframes flare { to { background: rgba(255, 77, 109, 0.6); } }

/* ---------- placing and look ---------- */
.phHead { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.timer { color: var(--amber); font-size: 15px; }
.tray { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.trayShip { flex: 1 1 140px; min-height: 48px; display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 10px; border: 1px dashed var(--rail2); background: var(--deck); cursor: pointer; text-align: left; min-width: 0; }
.trayShip.placed { border-style: solid; }
.trayShip.sel { border-color: var(--amber); box-shadow: 0 0 0 1px var(--amber) inset; }
.trayShip .sn { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.others { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--deck); border: 1px solid var(--rail); font-size: 13px; }
.look { text-align: center; }
.lookHead { display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left; }
.lookHead p { margin: 0 0 6px; }
.lookWrap { position: relative; margin-top: 10px; }
.bigcount { font-size: 54px; font-weight: 700; color: var(--amber); text-shadow: 0 0 20px rgba(255, 179, 71, 0.5); min-width: 1.2em; text-align: right; }
.shiplist { list-style: none; padding: 0; margin: 14px auto 0; display: flex; flex-direction: column; gap: 6px; text-align: left; max-width: 420px; }
.shiplist li { display: flex; align-items: center; gap: 10px; font-size: 15px; }

/* ---------- battle ---------- */
.battle { display: flex; flex-direction: column; gap: 10px; }
.feed { display: flex; justify-content: space-between; gap: 10px; align-items: center; width: 100%; min-height: 40px; padding: 8px 12px; border-radius: 10px; background: var(--deck); border: 1px solid var(--rail); text-align: left; cursor: pointer; }
.feed .fd { font-size: 15px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.feed .fl { font-size: 11px; color: var(--dim); flex: 0 0 auto; }
.wait { padding: 12px; border-radius: 12px; background: var(--deck); border: 1px solid var(--rail); }
.waitTop { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-weight: 700; font-size: 18px; }
.waitTop .timer { margin-left: auto; }
.waitMe { margin-top: 6px; color: var(--mute); font-size: 13px; }
.act { display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 14px; background: linear-gradient(180deg, rgba(255, 179, 71, 0.08), transparent 60%), var(--deck); border: 1px solid rgba(255, 179, 71, 0.4); }
.actTop { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.yt { display: flex; align-items: center; gap: 10px; }
.yturn { font-family: var(--display); font-weight: 700; font-size: 18px; color: var(--amber); letter-spacing: 0.06em; text-transform: uppercase; }
.scrapnow { font-size: 13px; color: var(--mute); }
.axis .seg button { min-height: 32px; }
.fire { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 62px; padding: 10px 18px 14px; border-radius: 12px; border: 0; background: var(--amber); color: var(--amber-ink); cursor: pointer; overflow: hidden; }
.fire .fl { font-family: var(--display); font-weight: 700; font-size: 26px; letter-spacing: 0.12em; }
.fire .fh { font-size: 16px; font-weight: 700; }
.fire.alt { background: #ffcf8a; }
.fire.warn { background: #ffd2c2; }
.fire:disabled { background: #3a3424; color: #8c7c5b; cursor: default; }
.fbar { position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: rgba(0, 0, 0, 0.18); }
.fbar i { display: block; height: 100%; width: 100%; background: rgba(31, 20, 5, 0.55); transition: width 0.25s linear; }
.fbar.low i { background: var(--alarm); }
.desc { margin: 0; font-size: 14px; color: var(--mute); }
.shop { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 5px; }
.shopchip { display: flex; flex-direction: column; align-items: center; gap: 1px; min-height: 64px; padding: 6px 2px 5px; border-radius: 10px; border: 1px solid var(--rail2); background: var(--deck2); cursor: pointer; text-align: center; min-width: 0; }
.shopchip .si { width: 22px; height: 22px; display: inline-flex; color: var(--ink); }
.shopchip .si svg { width: 100%; height: 100%; }
.shopchip .cn { font-family: var(--display); font-weight: 600; font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.shopchip .cp { font-size: 11px; color: var(--amber); }
.shopchip.on { border-color: var(--amber); background: rgba(255, 179, 71, 0.16); }
.shopchip.hold .cp { color: #ff9b9b; }
.shopchip:disabled { opacity: 0.38; cursor: default; }
#tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding: 0 12px calc(10px + env(safe-area-inset-bottom, 0px)); pointer-events: none; }
.tab { pointer-events: auto; max-width: 496px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 10px 10px 16px; border-radius: 14px; background: var(--amber); color: var(--amber-ink); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); animation: rise 0.25s ease-out; }
.tab .tt { font-family: var(--display); font-weight: 700; font-size: 18px; letter-spacing: 0.04em; }
.tab .btn { background: var(--amber-ink); color: var(--amber); border-color: var(--amber-ink); }
.tab.bund { background: var(--alarm); color: #fff; animation: rise 0.25s ease-out, throb 1s ease-in-out infinite; }
.tab.bund .btn { background: #fff; color: var(--alarm); border-color: #fff; }
@keyframes rise { from { transform: translateY(20px); opacity: 0; } }
@keyframes throb { 50% { box-shadow: 0 0 0 6px rgba(255, 59, 59, 0.3), 0 10px 30px rgba(0, 0, 0, 0.5); } }

/* ---------- end ---------- */
.end { display: flex; flex-direction: column; gap: 6px; padding: 14px; border-radius: 14px; background: var(--deck); border: 1px solid var(--rail); }
.admiral { display: flex; align-items: center; gap: 14px; padding: 6px 0 4px; }
.aic { width: 44px; height: 44px; color: var(--pc, var(--amber)); display: inline-flex; flex: 0 0 auto; }
.aic svg { width: 100%; height: 100%; }
.aic.big { width: 84px; height: 84px; margin: 0 auto 10px; color: var(--amber); }
.admiral .an { font-family: var(--display); font-weight: 700; font-size: 30px; color: var(--pc); line-height: 1.1; }
.admiral .lbl { margin: 0; }
.give { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.givebtn { display: flex; align-items: center; gap: 8px; min-height: 52px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--rail2); background: var(--deck2); cursor: pointer; font-family: var(--display); font-weight: 700; text-align: left; min-width: 0; }
.givebtn .gv { margin-left: auto; color: var(--amber); }
.titles { list-style: none; padding: 0; margin: 6px 0 0; display: flex; flex-direction: column; gap: 8px; }
.titles li { display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; column-gap: 10px; }
.titles .tn { font-family: var(--display); font-weight: 700; color: var(--amber); }
.titles .tw { font-weight: 600; text-align: right; }
.titles .tv { grid-column: 1 / -1; font-size: 12px; color: var(--mute); }
.tblwrap { overflow-x: auto; }
table.stats { width: 100%; border-collapse: collapse; font-size: 13px; }
.stats th { color: var(--dim); font-weight: 400; text-align: right; padding: 4px 6px; border-bottom: 1px solid var(--rail); }
.stats td { text-align: right; padding: 6px; border-bottom: 1px solid rgba(23, 58, 76, 0.6); }
.stats td.who { text-align: left; display: flex; align-items: center; gap: 6px; font-family: var(--body); font-size: 15px; }
.stats tr.me td { color: var(--amber); }
.waitline { color: var(--mute); font-size: 14px; margin: 12px 0 0; }

/* ---------- lobby ---------- */
.roomCard { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; padding: 14px; border-radius: 14px; background: var(--deck); border: 1px solid var(--rail); margin-top: 6px; }
.roomLeft { min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
.roomLeft .lbl { margin: 0; }
.bigcode { font-size: clamp(34px, 11vw, 48px); font-weight: 700; letter-spacing: 0.22em; color: var(--amber); line-height: 1; }
.bigcode.huge { font-size: 110px; }
.roomLeft .tiny { overflow-wrap: anywhere; }
.qr { width: 120px; max-width: 34vw; border-radius: 10px; overflow: hidden; }
.qr svg { display: block; width: 100%; height: auto; }
.qr.big { width: min(42vw, 420px); max-width: none; }
.count { color: var(--dim); }
.crew { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
.mate { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; background: var(--deck); border: 1px solid var(--rail); }
.mate .who { flex: 1; min-width: 0; }
.mate .nm { font-family: var(--display); font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 6px; }
.mate .you { color: var(--dim); font-weight: 600; font-size: 13px; }
.mate .fleet { font-size: 13px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crew.big .mate { padding: 16px; }
.crew.big .nm { font-size: 26px; }
.setgrid { display: grid; grid-template-columns: 1fr; gap: 2px; }
.setgrid .lbl { margin-top: 10px; }

/* ---------- table screen ---------- */
.tableLobby { display: grid; grid-template-columns: 1fr auto; gap: 40px; align-items: center; min-height: 90vh; }
.tableLobby .logo { font-size: 72px; margin: 10px 0; }
.tableGame { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(320px, 1fr); gap: 28px; align-items: start; }
.tLeft { min-width: 0; }
.tRight { display: flex; flex-direction: column; gap: 14px; min-width: 0; max-height: calc(100vh - 32px); overflow-y: auto; }
.tableHint { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; margin-top: 18px; }
.tableHint p { margin: 0; }
.tableAlt { width: 100%; margin-top: 10px; }
.ttop { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin-bottom: 12px; font-size: 16px; }
.tturn { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 14px; background: var(--deck); border: 1px solid var(--amber); font-family: var(--display); font-weight: 700; font-size: 26px; }
.tturn .timer { margin-left: auto; font-size: 22px; }
.tlog, .logl { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
.tlog li, .logl li { display: grid; grid-template-columns: 36px 1fr; gap: 8px; padding: 8px 10px; border-radius: 8px; background: var(--deck); font-size: 15px; }
.tlog li { font-size: 17px; }
.tlog .r, .logl .r { color: var(--dim); font-size: 12px; padding-top: 3px; }

/* ---------- overlays, toasts, sheets ---------- */
#overlay { position: fixed; inset: 0; z-index: 60; display: none; align-items: center; justify-content: center; pointer-events: none; }
#overlay.on { display: flex; animation: ovIn 0.25s ease-out; }
@keyframes ovIn { from { opacity: 0; } }
#overlay.bund { background: rgba(120, 0, 0, 0.82); }
.beacon { position: absolute; inset: -50%; background: conic-gradient(from 0deg, rgba(255, 59, 59, 0.0), rgba(255, 80, 80, 0.55) 10%, rgba(255, 59, 59, 0) 22%, rgba(255, 59, 59, 0) 50%, rgba(255, 80, 80, 0.55) 60%, rgba(255, 59, 59, 0) 72%); animation: spin 0.9s linear infinite; }
.ovText { position: relative; text-align: center; padding: 20px; }
.ovBig { font-family: var(--display); font-weight: 700; font-size: clamp(64px, 26vw, 180px); line-height: 0.95; letter-spacing: 0.06em; color: #fff; text-shadow: 0 0 40px rgba(255, 255, 255, 0.35); }
.ovBig.name { font-size: clamp(40px, 13vw, 110px); overflow-wrap: anywhere; letter-spacing: 0.02em; }
.ovSub { font-family: var(--display); font-weight: 700; font-size: clamp(22px, 7vw, 44px); margin-top: 6px; color: #fff; }
#overlay.wx { background: rgba(4, 12, 18, 0.72); }
.wxCard { width: min(86vw, 420px); padding: 28px 24px; border-radius: 20px; background: linear-gradient(180deg, #10303f, #0a1e29); border: 1px solid var(--amber); text-align: center; box-shadow: 0 20px 80px rgba(0, 0, 0, 0.6); animation: drop 0.5s cubic-bezier(.2, 1.4, .4, 1); }
.wxCard .ovBig { font-size: clamp(40px, 12vw, 64px); color: var(--amber); margin-top: 6px; }
.wxCard .ovSub { font-family: var(--body); font-weight: 500; font-size: 20px; color: var(--ink); }
.wxIc { width: 64px; height: 64px; margin: 0 auto 10px; color: var(--amber); }
.wxIc svg { width: 100%; height: 100%; }
@keyframes drop { from { transform: translateY(-40px) scale(0.92); opacity: 0; } }
#overlay.win { background: radial-gradient(circle at 50% 45%, rgba(255, 179, 71, 0.25), rgba(4, 12, 18, 0.85) 60%); }
#toasts { position: fixed; left: 0; right: 0; top: max(10px, env(safe-area-inset-top)); z-index: 70; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; padding: 0 16px; }
.toast { max-width: 480px; padding: 9px 14px; border-radius: 10px; background: rgba(13, 38, 51, 0.96); border: 1px solid var(--rail2); font-size: 15px; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4); animation: rise 0.25s ease-out; transition: opacity 0.35s, transform 0.35s; }
.toast.out { opacity: 0; transform: translateY(-8px); }
.toast.warn { border-color: var(--amber); color: var(--amber); }
.toast.drink { background: var(--amber); color: var(--amber-ink); font-family: var(--display); font-weight: 700; font-size: 18px; border-color: var(--amber); }
.toast.fc { border-color: rgba(255, 179, 71, 0.6); }
.toast.alt { border-color: var(--sonar); }
#banner { position: fixed; left: 0; right: 0; top: 34%; z-index: 65; display: flex; justify-content: center; pointer-events: none; padding: 0 16px; }
.banner { max-width: 460px; text-align: center; padding: 14px 26px; border-radius: 14px; background: rgba(6, 19, 28, 0.94); border: 2px solid var(--pc); box-shadow: 0 0 40px rgba(0, 0, 0, 0.6), 0 0 30px color-mix(in srgb, var(--pc) 35%, transparent); animation: pop 0.35s cubic-bezier(.2, 1.5, .4, 1); transition: opacity 0.35s, transform 0.35s; }
.banner.out { opacity: 0; transform: scale(0.96); }
.banner .bt { font-family: var(--display); font-weight: 700; font-size: 24px; color: var(--pc); text-wrap: balance; }
.banner .bs { font-size: 16px; color: var(--mute); margin-top: 2px; }
@keyframes pop { from { transform: scale(0.8); opacity: 0; } }
.tab.bump { animation: rise 0.25s ease-out, bump 0.6s ease-out; }
@keyframes bump { 30% { transform: scale(1.04); } }
#sheet { position: fixed; inset: 0; z-index: 80; display: none; }
#sheet.on { display: block; }
.scrim { position: absolute; inset: 0; background: rgba(2, 8, 12, 0.6); }
.panelSheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 82vh; overflow-y: auto; max-width: 560px; margin: 0 auto; padding: 14px 16px calc(20px + env(safe-area-inset-bottom, 0px)); border-radius: 18px 18px 0 0; background: var(--deck); border: 1px solid var(--rail2); animation: rise 0.25s ease-out; }
.sheetHead { display: flex; justify-content: space-between; align-items: center; }
.sheetHead .h3 { margin: 6px 0; }
.menu { display: flex; flex-direction: column; gap: 10px; }
.kicks { display: flex; flex-wrap: wrap; gap: 6px; }
.rules p { margin: 0 0 6px; color: var(--ink); max-width: 62ch; }
#netstatus { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); z-index: 75; padding: 8px 14px; border-radius: 999px; background: var(--alarm); color: #fff; font-family: var(--display); font-weight: 700; font-size: 14px; }

@media (max-width: 380px) {
  #app { padding-left: 12px; padding-right: 12px; }
  .caps { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 900px) {
  .tableGame { grid-template-columns: 1fr; }
  .tableLobby { grid-template-columns: 1fr; }
  .bigcode.huge { font-size: 64px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}

<main id="app"></main>
<div id="overlay" aria-live="assertive"></div>
<div id="toasts" aria-live="polite"></div>
<div id="banner" aria-live="polite"></div>
<div id="sheet"></div>
<div id="netstatus" role="status" hidden></div>
<noscript><p style="padding:24px;color:#d6eaf1;font-family:sans-serif">Søslag kræver JavaScript. / Søslag needs JavaScript.</p></noscript>
<script>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(row * cellSize, col * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
