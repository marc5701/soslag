    return room.host;
  }
  function colorFree(room, c, id) {
    return Number.isInteger(c) && c >= 0 && c < COLORS && !room.seats.some(s => s.id !== id && !s.removed && s.color === c);
  }
  function firstFreeColor(room) {
    for (let c = 0; c < COLORS; c++) if (colorFree(room, c, null)) return c;
    return 0;
  }
  function cleanShips(room, a) {
    return FLEET.map((L, s) => clean(a && a[s], 28) || pick(room, SHIP_NAMES[L]));
  }
  function wxActive(g, card) { return !!(g.wx.now && g.wx.now.card === card && g.wx.now.r === g.round); }
  function priceOf(g, kind) {
    if (GADGETS.indexOf(kind) >= 0 && wxActive(g, 'stille')) return 0;
    return PRICE[kind];
  }
  function afloat(g) {
    return g.order.filter(id => !g.gone[id] && g.fleets[id] && g.fleets[id].some(sh => !sh.sunk));
  }
  function live(g) { return g.order.filter(id => !g.gone[id]); }
  function ownCells(g, id) {
    const out = [];
    if (g.fleets[id]) g.fleets[id].forEach(sh => sh.cells.forEach(c => { if (g.shot[c] === 0) out.push(c); }));
    return out;
  }
  function log(g, ev) {
    ev.r = g.round;
    g.log.push(ev);
    if (g.log.length > R.logMax) g.log.splice(0, g.log.length - R.logMax);
  }

  /* ---------- sips and scrap ---------- */
  function drink(room, g, id, n, why, list) {
    const t = g.tab[id];
    if (!n || !t) return;
    t.total += n;
    if (isBot(room, id)) t.paid += n; else t.owe += n;
    if (list) {
      const e = list.find(d => d.id === id && d.why === why);
      if (e) e.n += n; else list.push({ id, n, why });
    }
  }
  function giveBund(room, g, id, list) {
    const t = g.tab[id];
    t.bunds++;
    if (g.bundMode === 'four') { drink(room, g, id, R.bundSips, 'bund', list); return; }
    if (!isBot(room, id)) t.bund++;
    if (list) list.push({ id, n: 0, why: 'bund' });
  }
  function earn(g, id, n) { g.scrap[id] += n; g.st[id].earned += n; }

  /* ---------- room ---------- */
  function newRoom(o) {
    return {
      v: 1, code: o.code, epoch: 1, rev: 0, host: o.creator, creator: o.creator,
      rng: (o.seed >>> 0) || 1, practice: !!o.practice,
      settings: { bund: 'bund', deal: 'place', clock: 30 },
      seats: [], phase: 'lobby', g: null, book: {}, online: {}, acks: [],
      nextFirst: null, botSeq: 0, games: 0, last: null
    };
  }

  function apply(room, it, now) {
    const fx = [];
    if (!it || typeof it.k !== 'string' || typeof it.from !== 'string') return { ok: false, err: 'bad', fx };
    if (it.iid && room.acks.indexOf(it.iid) >= 0) return { ok: true, dup: true, fx };
    const res = dispatch(room, it, now, fx);
    if (res === true && it.iid) {
      room.acks.push(it.iid);
      if (room.acks.length > 80) room.acks.splice(0, room.acks.length - 80);
    }
    return { ok: res === true, err: res === true ? null : res, fx };
  }

  function dispatch(room, it, now, fx) {
    const from = it.from, g = room.g;
    switch (it.k) {
      case 'join': return doJoin(room, it, now, fx);
      case 'leave': {
        if (room.phase !== 'lobby') return 'phase';
        const s = seatOf(room, from);
        if (!s) return true;
        room.seats.splice(room.seats.indexOf(s), 1);
        fx.push({ t: 'left', id: from });
        return true;
      }
      case 'settings': {
        if (from !== adminId(room)) return 'admin';
        if (room.phase !== 'lobby') return 'phase';
        const st = room.settings;
        if (it.bund === 'bund' || it.bund === 'four') st.bund = it.bund;
        if (it.deal === 'place' || it.deal === 'blind') st.deal = it.deal;
        if (CLOCKS.indexOf(it.clock) >= 0) st.clock = it.clock;
        return true;
      }
      case 'bot+': {
        if (from !== adminId(room)) return 'admin';
        if (room.phase !== 'lobby') return 'phase';
        if (room.seats.length >= R.maxSeats) return 'full';
        const id = 'bot' + (++room.botSeq);
        const used = new Set(room.seats.map(s => s.name));
        const name = BOT_NAMES.find(nm => !used.has(nm)) || ('Bot-' + room.botSeq);
        room.seats.push({ id, kind: 'bot', name, color: firstFreeColor(room), ships: FLEET.map(L => pick(room, SHIP_NAMES[L])) });
        fx.push({ t: 'join', id });
        return true;
      }
      case 'kick': {
        if (from !== adminId(room)) return 'admin';
        const s = seatOf(room, it.id);
        if (!s || s.id === from) return 'bad';
        if (room.phase === 'lobby') {
          room.seats.splice(room.seats.indexOf(s), 1);
          fx.push({ t: 'left', id: s.id });
          return true;
        }
        if (s.removed) return true;
        s.removed = true;
        if (g && g.order.indexOf(s.id) >= 0 && g.phase !== 'over') scuttle(room, g, s.id, now, fx);
        return true;
      }
      case 'start': {
        if (from !== adminId(room)) return 'admin';
        if (room.phase !== 'lobby') return 'phase';
        const seats = room.seats.filter(s => !s.removed);
        if (seats.length < 2) return 'few';
        if (!seats.some(s => s.kind === 'human')) return 'nohuman';
        newGame(room, now, fx);
        return true;
      }
      case 'draft':
      case 'ready': {
        if (!g || g.phase !== 'placing') return 'phase';
        if (g.order.indexOf(from) < 0 || g.gone[from]) return 'seat';
        if (g.ready[from]) return 'ready';
        if (it.k === 'draft') {
          if (!validFleet(g.n, it.ships, true)) return 'bad';
          g.drafts[from] = it.ships.map(s => (s ? s.slice() : null));
          return true;
        }
        if (!validFleet(g.n, it.ships, false)) return 'bad';
        g.fleets[from] = makeFleet(room, from, it.ships.map(s => s.slice()));
        g.ready[from] = true;
        fx.push({ t: 'ready', id: from });
        if (allReady(g)) endPlacing(room, g, now, fx);
        return true;
      }
      case 'gadget': {
        if (!g) return 'phase';
        return doGadget(room, g, from, it.g, it, now, fx);
      }
      case 'attack': {
        if (!g) return 'phase';
        return doAttack(room, g, from, it.w, it, now, fx);
      }
      case 'hold': {
        if (!g || g.phase !== 'battle' || !g.turn || g.turn.id !== from) return 'turn';
        holdTurn(room, g, now, fx, 'hold');
        return true;
      }
      case 'pay': {
        if (!g || !g.tab[from]) return 'bad';
        const t = g.tab[from];
        t.paid += t.owe; t.owe = 0;
        t.bundsPaid += t.bund; t.bund = 0;
        return true;
      }
      case 'give': {
        if (!g || g.phase !== 'admiral' || g.admiral.id !== from) return 'phase';
        if (g.order.indexOf(it.to) < 0 || g.gone[it.to]) return 'bad';
        if (g.admiral.left <= 0) return 'done';
        admiralGive(room, g, from, it.to, fx);
        if (g.admiral.left <= 0) finishGame(room, g, now, fx);
        return true;
      }
      case 'giveDone': {
        if (!g || g.phase !== 'admiral' || g.admiral.id !== from) return 'phase';
        finishGame(room, g, now, fx);
        return true;
      }
      case 'rematch': {
        if (from !== adminId(room)) return 'admin';
        if (room.phase !== 'game' || !g || g.phase !== 'over') return 'phase';
        const firstOut = g.out.find(id => { const s = seatOf(room, id); return s && !s.removed; });
        room.nextFirst = firstOut || null;
        room.seats = room.seats.filter(s => !s.removed);
        room.last = { nr: g.nr, w: g.winner };
        room.phase = 'lobby';
        room.g = null;
        fx.push({ t: 'lobby' });
        return true;
      }
    }
    return 'unknown';
  }

  function doJoin(room, it, now, fx) {
    const id = clean(it.from, 40);
    if (!id) return 'bad';
    let s = seatOf(room, id);
    const name = clean(it.name, 16) || 'Kaptajn';
    if (s) {
      if (room.phase === 'lobby' && !s.removed) {
        s.name = name;
        s.ships = cleanShips(room, it.ships);
        if (colorFree(room, it.color, id)) s.color = it.color;
      }
      return true;
    }
    if (room.phase !== 'lobby') return 'started';
    if (room.seats.length >= R.maxSeats) return 'full';
    s = { id, kind: 'human', name, ships: cleanShips(room, it.ships), color: colorFree(room, it.color, id) ? it.color : firstFreeColor(room) };
    room.seats.push(s);
    fx.push({ t: 'join', id });
    return true;
  }

  /* ---------- game setup ---------- */
  function makeFleet(room, id, cells) {
    const s = seatOf(room, id);
    return FLEET.map((len, k) => ({ len, name: (s && s.ships[k]) || '', cells: cells[k], sunk: false }));
  }
  function allReady(g) { return g.order.every(id => g.gone[id] || g.ready[id]); }

  function newGame(room, now, fx) {
    room.seats = room.seats.filter(s => !s.removed);
    const ids = room.seats.map(s => s.id);
    const n = R.sizeFor(ids.length);
    const g = {
      nr: ++room.games, n, order: ids, phase: 'placing', phaseEnds: now + R.placeMs, started: now,
      fleets: {}, drafts: {}, ready: {}, shot: new Array(n * n).fill(0), occ: null,
      mines: [], mineSeq: 0, scrap: {}, tab: {}, st: {}, gone: {}, out: [], outR: {},
      round: 0, queue: [], leader: null, turn: null, turnNr: 0,
      wx: { cad: ids.length === 2 ? 3 : 2, deck: [], fc: null, now: null },
      winner: null, admiral: null, bm: {}, log: [], blind: room.settings.deal === 'blind', bundMode: room.settings.bund
    };
    for (const id of ids) {
      g.scrap[id] = R.startScrap;
      g.tab[id] = { owe: 0, bund: 0, paid: 0, bundsPaid: 0, total: 0, bunds: 0 };
      g.st[id] = { sq: 0, hit: 0, water: 0, self: 0, sinks: 0, earned: 0, spent: 0, buys: 0, torps: 0 };
    }
    room.g = g;
    room.phase = 'game';
    for (const id of ids) {
      if (isBot(room, id) || g.blind) { g.fleets[id] = makeFleet(room, id, randomFleet(room, n)); g.ready[id] = true; }
    }
    fx.push({ t: 'start', nr: g.nr, blind: g.blind });
    if (allReady(g)) endPlacing(room, g, now, fx);
  }

  function endPlacing(room, g, now, fx) {
    for (const id of g.order) {
      if (g.gone[id] || g.ready[id]) continue;
      const d = g.drafts[id];
      const keep = d && validFleet(g.n, d, true) ? d : null;
      g.fleets[id] = makeFleet(room, id, randomFleet(room, g.n, keep));
      g.ready[id] = true;
    }
    g.occ = [];
    for (let c = 0; c < g.n * g.n; c++) g.occ.push([]);
    for (const id of g.order) {
      if (!g.fleets[id]) continue;
      g.fleets[id].forEach((sh, s) => sh.cells.forEach(c => g.occ[c].push([id, s])));
    }
    for (const id of g.order) if (isBot(room, id) && g.fleets[id]) initBotMem(room, g, id, R.botForget);
    g.phase = 'look';
    g.phaseEnds = now + (g.blind ? R.blindLookMs : R.lookMs);
    fx.push({ t: 'look', ms: g.phaseEnds - now });
  }

  function initBotMem(room, g, id, forget, skill, lapse) {
    const mem = [];
    g.fleets[id].forEach(sh => sh.cells.forEach(c => { if (rnd(room) >= forget) mem.push(c); }));
    g.bm[id] = { mem, pings: [], skill: skill == null ? R.botSkill : skill, lapse: lapse == null ? R.botLapse : lapse };
  }

  function startBattle(room, g, now, fx) {
    g.phase = 'battle';
    g.wx.deck = shuffle(room, CARDS.slice());
    let first = room.nextFirst;
    if (!first || g.order.indexOf(first) < 0 || g.gone[first]) first = pick(room, live(g));
    g.leader = first;
    fx.push({ t: 'battle', first });
    const outs = collide(room, g, now, fx, true);
    checkEnd(room, g, now, fx, outs);
    if (g.phase === 'battle') startTurn(room, g, now, fx);
  }

  /* ---------- turns and rounds ---------- */
  function startTurn(room, g, now, fx) {
    for (let guard = 0; guard < 4 * g.order.length + 4; guard++) {
      if (g.phase !== 'battle') return;
      if (!g.queue.length) {
        newRound(room, g, now, fx);
        if (g.phase !== 'battle') return;
        if (!g.queue.length) return;
      }
      const id = g.queue.shift();
      if (g.gone[id]) continue;
      const krudt = wxActive(g, 'krudt');
      g.turn = {
        id, start: now, deadline: room.settings.clock ? now + room.settings.clock * 1000 : 0,
        attacks: krudt ? 2 : 1, max: krudt ? 2 : 1, fired: 0, gadget: null, nr: ++g.turnNr,
        bot: isBot(room, id) ? { stage: 0, at: now + R.botThinkMs } : null
      };
      fx.push({ t: 'turn', id, r: g.round, nr: g.turnNr });
      return;
    }
  }
  function endTurn(room, g, now, fx) { startTurn(room, g, now, fx); }

  function newRound(room, g, now, fx) {
    g.round++;
    g.wx.now = null;
    const cad = g.wx.cad, r = g.round;
    fx.push({ t: 'round', r });
    if (r >= cad + 1 && (r - 1) % cad === 0 && g.wx.fc) {
      const card = g.wx.fc.card;
      g.wx.fc = null;
      g.wx.now = { card, r };
      applyWeather(room, g, card, now, fx);
      if (g.phase !== 'battle') return;
    }
    if (r >= cad && r % cad === 0) {
      if (!g.wx.deck.length) g.wx.deck = shuffle(room, CARDS.slice());
      const card = g.wx.deck.shift();
      g.wx.fc = { card, r: r + 1 };
      const ev = { t: 'fc', card, at: r + 1 };
      fx.push(ev); log(g, ev);
    }
    const lv = live(g);
    if (!lv.length) return;
    if (g.gone[g.leader] || lv.indexOf(g.leader) < 0) {
      const i0 = g.order.indexOf(g.leader);
      for (let k = 1; k <= g.order.length; k++) {
        const id = g.order[(i0 + k) % g.order.length];
        if (!g.gone[id]) { g.leader = id; break; }
      }
    }
    const i = lv.indexOf(g.leader);
    g.queue = lv.slice(i).concat(lv.slice(0, i));
  }

  function holdTurn(room, g, now, fx, why) {
    const t = g.turn;
    if (!t) return;
    const ev = { t: 'hold', by: t.id, why, dr: [], fired: t.fired };
    if (!t.fired && why !== 'skip') drink(room, g, t.id, R.holdSips, 'hold', ev.dr);
    fx.push(ev); log(g, ev);
    endTurn(room, g, now, fx);
  }

  /* ---------- weather ---------- */
  function applyWeather(room, g, card, now, fx) {
    const ev = { t: 'wx', card, dr: [] };
    const lv = live(g);
    const humans = lv.filter(id => !isBot(room, id));
    switch (card) {
      case 'skaal':
        lv.forEach(id => drink(room, g, id, R.skaalSips, 'wx', ev.dr));
        break;
      case 'tort': {
        if (!humans.length) break;
        const score = id => g.tab[id].total + 6 * g.tab[id].bunds;
        const min = Math.min.apply(null, humans.map(score));
        humans.filter(id => score(id) === min).forEach(id => drink(room, g, id, R.drySips, 'wx', ev.dr));
        break;
      }
      case 'taage': {
        const water = [];
        g.shot.forEach((v, c) => { if (v === 1) water.push(c); });
        shuffle(room, water);
        ev.cells = water.slice(0, R.fogBank);
        ev.cells.forEach(c => { g.shot[c] = 0; });
        break;
      }
      case 'lyn': {
        const fog = [];
        g.shot.forEach((v, c) => { if (v === 0) fog.push(c); });
        if (!fog.length) break;
        const c = pick(room, fog);
        const r = strike(g, [c], null);
        ev.c = c;
        ev.ships = r.sq[0].ships;
        ev.mines = r.mines.map(m => m.id);
        ev.sinks = r.sinks.map(x => [x.o, x.s]);
        r.hits.forEach(h => drink(room, g, h.o, 1, 'lyn', ev.dr));
        r.sinks.forEach(x => drink(room, g, x.o, g.fleets[x.o][x.s].len, 'sink', ev.dr));
        fx.push(ev); log(g, ev);
        afterBlast(room, g, now, fx, []);
        return;
      }
      case 'blus': {
        ev.flares = {};
        afloat(g).forEach(id => {
          const cells = ownCells(g, id);
          if (!cells.length) return;
          const c = pick(room, cells);
          ev.flares[id] = c;
          if (g.bm[id] && g.bm[id].mem.indexOf(c) < 0) g.bm[id].mem.push(c);
        });
        break;
      }
      case 'drivtoemmer':
        lv.forEach(id => { g.scrap[id] += R.driftwood; });
        break;
      case 'pirater': {
        if (lv.length < 2) break;
        let rich = lv[0], poor = lv[0];
        lv.forEach(id => { if (g.scrap[id] > g.scrap[rich]) rich = id; if (g.scrap[id] < g.scrap[poor]) poor = id; });
        if (g.scrap[rich] === g.scrap[poor]) break;
        const amt = Math.min(R.pirates, g.scrap[rich]);
        g.scrap[rich] -= amt; g.scrap[poor] += amt;
        ev.from = rich; ev.to = poor; ev.n = amt;
        break;
      }
      default: break;
    }
    fx.push(ev); log(g, ev);
  }

  /* ---------- attacks ---------- */
  function strike(g, cells, by) {
    const r = { sq: [], hits: [], sinks: [], mines: [], self: false };
    const touched = [];
    for (const c of cells) {
      if (g.shot[c] !== 0) continue;
      const here = g.occ[c].filter(x => !g.gone[x[0]]);
      g.shot[c] = here.length ? 2 : 1;
      const mh = [];
      for (const m of g.mines) {
        if (m.live && m.c === c) { m.live = false; m.boom = by ? 'shot' : 'dud'; m.trig = by || null; mh.push(m.id); r.mines.push(m); }
      }
      r.sq.push({ c, ships: here.map(x => [x[0], x[1]]), mines: mh });
      for (const x of here) {
        r.hits.push({ o: x[0], s: x[1], c });
        if (x[0] === by) r.self = true;
        if (!touched.some(t => t[0] === x[0] && t[1] === x[1])) touched.push([x[0], x[1]]);
      }
    }
    for (const t of touched) {
      const sh = g.fleets[t[0]][t[1]];
      if (!sh.sunk && sh.cells.every(x => g.shot[x] === 2)) { sh.sunk = true; sh.sunkR = g.round; r.sinks.push({ o: t[0], s: t[1] }); }
    }
    return r;
  }

  function resolveAttack(room, g, now, fx, cells, by, kind, extra) {
    const r = strike(g, cells, by);
    const ev = Object.assign({ t: 'atk', by, w: kind, cells: cells.slice(), sq: r.sq, sinks: r.sinks.map(x => [x.o, x.s]), dr: [], scrap: 0, bund: false, mines: [] }, extra || {});
    const st = g.st[by];
    r.sq.forEach(q => {
      st.sq++;
      if (q.ships.some(x => x[0] !== by)) st.hit++;
      if (!q.ships.length) st.water++;
    });
    const hs = wxActive(g, 'kuling') ? 2 : 1;
    if (r.self) { ev.bund = true; st.self++; giveBund(room, g, by, ev.dr); }
    r.hits.forEach(h => { if (h.o !== by) { drink(room, g, h.o, hs, 'hit', ev.dr); earn(g, by, 1); ev.scrap += 1; } });
    r.sinks.forEach(x => {
      const len = g.fleets[x.o][x.s].len;
      if (x.o !== by) { drink(room, g, x.o, len, 'sink', ev.dr); earn(g, by, len); ev.scrap += len; st.sinks++; }
    });
    r.mines.forEach(m => {
      ev.mines.push({ id: m.id, c: m.c, by: m.by });
      if (!r.self) drink(room, g, by, R.mineSips, 'mine', ev.dr);
    });
    if (kind === 'torpedo') st.torps++;
    fx.push(ev); log(g, ev);
    afterBlast(room, g, now, fx, []);
  }

  function updateGhosts(g, fx) {
    const out = [];
    for (const id of g.order) {
      if (g.gone[id] || g.out.indexOf(id) >= 0 || !g.fleets[id]) continue;
      if (g.fleets[id].every(sh => sh.sunk)) {
        g.out.push(id); g.outR[id] = g.round; out.push(id);
        const ev = { t: 'ghost', id };
        fx.push(ev); log(g, ev);
      }
    }
    return out;
  }

  function collide(room, g, now, fx, launch) {
    let outs = [];
    for (let guard = 0; guard < 64; guard++) {
      const af = afloat(g);
      if (af.length < 2) break;
      let at = -1;
      for (let c = 0; c < g.n * g.n && at < 0; c++) {
        if (g.shot[c] !== 0) continue;
        const owners = {};
        g.occ[c].forEach(x => { if (!g.gone[x[0]]) owners[x[0]] = 1; });
        if (af.every(id => owners[id])) at = c;
      }
      if (at < 0) break;
      const r = strike(g, [at], null);
      const ev = { t: 'col', c: at, ships: r.sq[0].ships, sinks: r.sinks.map(x => [x.o, x.s]), dr: [], launch: !!launch };
      const hs = wxActive(g, 'kuling') ? 2 : 1;
      r.hits.forEach(h => drink(room, g, h.o, hs, 'col', ev.dr));
      r.sinks.forEach(x => drink(room, g, x.o, g.fleets[x.o][x.s].len, 'sink', ev.dr));
      fx.push(ev); log(g, ev);
      outs = outs.concat(updateGhosts(g, fx));
    }
    return outs;
  }

  function afterBlast(room, g, now, fx, prior) {
    let outs = (prior || []).concat(updateGhosts(g, fx));
    outs = outs.concat(collide(room, g, now, fx, false));
    checkEnd(room, g, now, fx, outs);
  }

  function checkEnd(room, g, now, fx, outsThisBlast) {
    if (g.phase !== 'battle') return;
    const af = afloat(g);
    if (af.length >= 2) return;
    let w = af[0];
    if (!w) {
      const cands = (outsThisBlast && outsThisBlast.length ? outsThisBlast : live(g)).filter(id => !g.gone[id]);
      const pool = cands.length ? cands : live(g);
      pool.sort((a, b) => g.scrap[b] - g.scrap[a] || g.st[b].hit - g.st[a].hit || g.order.indexOf(a) - g.order.indexOf(b));
      w = pool[0];
    }
    g.winner = w;
    g.turn = null;
    g.queue = [];
    if (!w) { g.phase = 'admiral'; finishGame(room, g, now, fx); return; }
    g.phase = 'admiral';
    g.admiral = { id: w, left: R.admiralSips, given: {}, until: now + (isBot(room, w) ? R.botAdmiralMs : R.admiralMs) };
    const ev = { t: 'win', id: w, tie: !af[0] };
    fx.push(ev); log(g, ev);
  }

  function doGadget(room, g, id, kind, arg, now, fx) {
    if (g.phase !== 'battle' || !g.turn || g.turn.id !== id) return 'turn';
    const t = g.turn;
    if (t.gadget) return 'used';
    if (t.attacks <= 0) return 'done';
    if (GADGETS.indexOf(kind) < 0) return 'bad';
    const price = priceOf(g, kind);
    if (g.scrap[id] < price) return 'poor';
    const N = g.n * g.n;
    let ev;
    if (kind === 'sonar') {
      const c = arg && arg.c;
      if (!Number.isInteger(c) || c < 0 || c >= N) return 'bad';
      const area = around(g.n, c);
      let cnt = 0;
      for (const x of area) if (g.shot[x] === 0) cnt += g.occ[x].filter(o => !g.gone[o[0]]).length;
      for (const m of g.mines) if (m.live && area.indexOf(m.c) >= 0) cnt++;
      ev = { t: 'sonar', by: id, c, n: cnt };
      const bm = g.bm[id];
      if (bm) {
        bm.pings.push({
          c, n: cnt, r: g.round,
          own: area.filter(x => g.shot[x] === 0 && bm.mem.indexOf(x) >= 0).length,
          mines: g.mines.filter(m => m.live && m.by === id && area.indexOf(m.c) >= 0).length
        });
      }
    } else if (kind === 'chart') {
      ev = { t: 'chart', by: id };
      if (g.bm[id]) g.bm[id].mem = ownCells(g, id);
    } else {
      const c = arg && arg.c;
      if (!Number.isInteger(c) || c < 0 || c >= N) return 'bad';
      if (g.shot[c] !== 0) return 'open';
      g.mines.push({ id: ++g.mineSeq, c, by: id, live: true });
      ev = { t: 'mine', by: id, c };
    }
    g.scrap[id] -= price;
    g.st[id].spent += price;
    g.st[id].buys++;
    t.gadget = kind;
    fx.push(ev); log(g, ev);
    return true;
  }

  function doAttack(room, g, id, kind, arg, now, fx) {
    if (g.phase !== 'battle' || !g.turn || g.turn.id !== id) return 'turn';
    const t = g.turn;
    if (t.attacks <= 0) return 'done';
    const n = g.n, N = n * n;
    let cells;
    const extra = {};
    if (kind === 'shell') {
      const c = arg && arg.c;
      if (!Number.isInteger(c) || c < 0 || c >= N) return 'bad';
      if (g.shot[c] !== 0) return 'open';
      cells = [c];
      extra.c = c;
    } else if (kind === 'depth' || kind === 'torpedo') {
      if (t.fired) return 'late';
      const price = PRICE[kind];
      if (g.scrap[id] < price) return 'poor';
      if (kind === 'depth') {
        const c = arg && arg.c;
        if (!Number.isInteger(c) || c < 0 || c >= N) return 'bad';
        cells = block(n, c);
        extra.c = cells[0];
      } else {
        const ax = arg && arg.axis, i = arg && arg.i;
        if ((ax !== 'r' && ax !== 'c') || !Number.isInteger(i) || i < 0 || i >= n) return 'bad';
        cells = line(n, ax, i);
        extra.axis = ax; extra.i = i;
      }
      if (!cells.some(c => g.shot[c] === 0)) return 'open';
      g.scrap[id] -= price;
      g.st[id].spent += price;
      g.st[id].buys++;
    } else return 'bad';
    t.fired++;
    t.attacks = kind === 'shell' ? t.attacks - 1 : 0;
    resolveAttack(room, g, now, fx, cells, id, kind, extra);
    if (g.phase !== 'battle' || g.turn !== t) return true;
    if (t.attacks <= 0) endTurn(room, g, now, fx);
    else {
      t.deadline = room.settings.clock ? now + room.settings.clock * 1000 : 0;
      if (t.bot) t.bot = { stage: 0, at: now + R.botThinkMs };
    }
    return true;
  }

  /* ---------- removal, admiral, end ---------- */
  function scuttle(room, g, id, now, fx) {
    g.gone[id] = true;
    g.queue = g.queue.filter(x => x !== id);
    g.mines.forEach(m => { if (m.by === id && m.live) { m.live = false; m.boom = 'gone'; } });
    const ev = { t: 'scuttle', id };
    fx.push(ev); log(g, ev);
    if (g.phase === 'placing') {
      if (allReady(g)) endPlacing(room, g, now, fx);
      return;
    }
    if (g.phase === 'battle') {
      const wasTurn = g.turn && g.turn.id === id;
      afterBlast(room, g, now, fx, []);
      if (g.phase === 'battle' && wasTurn) startTurn(room, g, now, fx);
      return;
    }
    if (g.phase === 'admiral' && g.admiral && g.admiral.id === id) finishGame(room, g, now, fx);
  }

  function admiralGive(room, g, by, to, fx) {
    g.admiral.left--;
    g.admiral.given[to] = (g.admiral.given[to] || 0) + 1;
    const ev = { t: 'give', by, to, dr: [] };
    drink(room, g, to, 1, 'adm', ev.dr);
    fx.push(ev);
  }
  function autoGive(room, g, fx) {
    const a = g.admiral;
    if (!a) return;
    const pool = live(g).filter(id => !isBot(room, id) && id !== a.id);
    while (a.left > 0 && pool.length) admiralGive(room, g, a.id, pick(room, pool), fx);
  }
  function finishGame(room, g, now, fx) {
    if (g.phase === 'over') return;
    g.phase = 'over';
    g.ended = now;
    for (const id of g.order) {
      const s = seatOf(room, id);
      const b = room.book[id] || (room.book[id] = { name: '', color: 0, kind: 'human', games: 0, wins: 0, sips: 0, bunds: 0 });
      if (s) { b.name = s.name; b.color = s.color; b.kind = s.kind; }
      b.games++;
      b.sips += g.tab[id].total;
      b.bunds += g.tab[id].bunds;
      if (id === g.winner) b.wins++;
    }
    const ev = { t: 'over', w: g.winner };
    fx.push(ev); log(g, ev);
  }

  /* ---------- clock-driven steps (host only) ---------- */
  function tick(room, now) {
    const fx = [], aims = [];
    const g = room.g;
    if (room.phase !== 'game' || !g) return { fx, aims };
    if (g.phase === 'placing') {
      if (now >= g.phaseEnds) endPlacing(room, g, now, fx);
    } else if (g.phase === 'look') {
      if (now >= g.phaseEnds) startBattle(room, g, now, fx);
    } else if (g.phase === 'battle' && g.turn) {
      const t = g.turn;
      if (t.bot) botStep(room, g, now, fx, aims);
      else if (room.online[t.id] === false && now - t.start >= R.offlineSkipMs) holdTurn(room, g, now, fx, 'skip');
      else if (t.deadline && now >= t.deadline) holdTurn(room, g, now, fx, 'clock');
    } else if (g.phase === 'admiral') {
      if (now >= g.admiral.until) { autoGive(room, g, fx); finishGame(room, g, now, fx); }
    }
    return { fx, aims };
  }

  /* ---------- bots ---------- */
  function botView(g, id) {
    const n = g.n, N = n * n, w = new Float64Array(N);
    const bm = g.bm[id] || { mem: [], pings: [] };
    const own = new Set(bm.mem.filter(c => g.shot[c] === 0));
    const hitOpen = new Uint8Array(N);
    let hunting = false;
    for (let c = 0; c < N; c++) {
      if (g.shot[c] === 2 && g.occ[c].some(x => x[0] !== id && !g.gone[x[0]] && !g.fleets[x[0]][x[1]].sunk)) { hitOpen[c] = 1; hunting = true; }
    }
    for (const L of FLEET) {
      for (let v = 0; v < 2; v++) {
        for (let c = 0; c < N; c++) {
          const cells = shipCells(n, c, L, v === 1);
          if (!cells) continue;
          let ok = true, h = 0;
          for (const x of cells) {
            if (g.shot[x] === 0) continue;
            if (hitOpen[x]) { h++; continue; }
            ok = false; break;
          }
          if (!ok) continue;
          const wt = 1 + h * 10;
          for (const x of cells) if (g.shot[x] === 0) w[x] += wt;
        }
      }
    }
    for (const p of bm.pings) {
      const fog = around(n, p.c).filter(x => g.shot[x] === 0);
      if (!fog.length) continue;
      const resid = p.n - p.own - p.mines;
      const f = resid <= 0 ? 0.12 : 1 + 0.9 * resid;
      for (const x of fog) w[x] *= f;
    }
    for (let c = 0; c < N; c++) if (g.shot[c] !== 0 || own.has(c)) w[c] = -1;
    return { w, own, hunting, bm };
  }

  function botGadget(room, g, id) {
    const n = g.n, N = n * n, sc = g.scrap[id];
    const v = botView(g, id);
    const calm = wxActive(g, 'stille');
    if (sc >= priceOf(g, 'mine') + 2 && rnd(room) < 0.35) {
      let best = -1, bc = -1;
      for (let c = 0; c < N; c++) {
        if (g.shot[c] !== 2 || !g.occ[c].some(x => x[0] === id && !g.fleets[id][x[1]].sunk)) continue;
        for (const x of neighbors4(n, c)) if (v.w[x] > best) { best = v.w[x]; bc = x; }
      }
      if (bc >= 0) return { k: 'mine', c: bc };
    }
    if (!v.hunting && sc >= priceOf(g, 'sonar') && (calm || rnd(room) < 0.55)) {
      let best = 0, bc = -1;
      for (let c = 0; c < N; c++) {
        if (v.bm.pings.some(p => Math.abs(Math.floor(p.c / n) - Math.floor(c / n)) <= 1 && Math.abs((p.c % n) - (c % n)) <= 1)) continue;
        let s = 0;
        for (const x of around(n, c)) if (v.w[x] > 0) s += v.w[x];
        if (s > best) { best = s; bc = c; }
      }
      if (bc >= 0) return { k: 'sonar', c: bc };
    }
    if (sc >= priceOf(g, 'chart') + 5 && rnd(room) < (calm ? 0.5 : 0.08)) return { k: 'chart' };
    return null;
  }

  function botAttack(room, g, id) {
    const t = g.turn, n = g.n, N = n * n, sc = g.scrap[id];
    const v = botView(g, id);
    let best = -1, bc = -1, top = 0;
    for (let c = 0; c < N; c++) {
      if (v.w[c] < 0) continue;
      if (v.w[c] > top) top = v.w[c];
      const s = v.w[c] * (1 + 0.25 * rnd(room));
      if (s > best) { best = s; bc = c; }
    }
    if (bc < 0) return { k: 'hold' };
    if ((!v.hunting && rnd(room) > (v.bm.skill == null ? 1 : v.bm.skill)) || (v.hunting && rnd(room) < (v.bm.lapse || 0))) {
      const open = [];
      for (let c = 0; c < N; c++) if (v.w[c] >= 0) open.push(c);
      bc = pick(room, open);
    }
    if (!t.fired) {
      if (sc >= PRICE.torpedo) {
        let lb = -1, la = null;
        for (const ax of ['r', 'c']) {
          for (let i = 0; i < n; i++) {
            const cells = line(n, ax, i);
            if (cells.some(c => v.own.has(c))) continue;
            const fog = cells.filter(c => g.shot[c] === 0);
            if (fog.length < Math.ceil(n / 2)) continue;
            const s = fog.reduce((a, c) => a + Math.max(0, v.w[c]), 0);
            if (s > lb) { lb = s; la = { axis: ax, i }; }
          }
        }
        if (la && lb >= 3 * top && rnd(room) < 0.7) return { k: 'torpedo', axis: la.axis, i: la.i };
      }
      if (sc >= PRICE.depth && v.hunting) {
        let bb = -1, bcell = -1;
        for (let c = 0; c < N; c++) {
          if (Math.floor(c / n) > n - 2 || c % n > n - 2) continue;
          const cells = block(n, c);
          if (cells.some(x => v.own.has(x))) continue;
          const s = cells.reduce((a, x) => a + Math.max(0, v.w[x]), 0);
          if (s > bb) { bb = s; bcell = c; }
        }
        if (bcell >= 0 && bb >= 1.6 * top && rnd(room) < 0.55) return { k: 'depth', c: bcell };
      }
    }
    return { k: 'shell', c: bc };
  }

  function botStep(room, g, now, fx, aims) {
    const t = g.turn, b = t.bot, id = t.id;
    if (now < b.at) return;
    if (b.stage === 0) {
      if (!t.gadget && !t.fired) {
        const gd = botGadget(room, g, id);
        if (gd) doGadget(room, g, id, gd.k, gd, now, fx);
      }
      const a = botAttack(room, g, id);
      b.plan = a; b.stage = 1; b.at = now + R.botAimMs;
      if (a.k !== 'hold') aims.push(Object.assign({ id, nr: t.nr }, a));
      return;
    }
    const a = b.plan;
    if (!a || a.k === 'hold') { holdTurn(room, g, now, fx, 'hold'); return; }
    const res = doAttack(room, g, id, a.k, a, now, fx);
    if (res !== true) {
      const fog = [];
      g.shot.forEach((x, c) => { if (x === 0) fog.push(c); });
      if (fog.length && doAttack(room, g, id, 'shell', { c: pick(room, fog) }, now, fx) === true) return;
      holdTurn(room, g, now, fx, 'hold');
    }
  }

  /* ---------- read helpers for the interface ---------- */
  function titles(room, g) {
    const ids = g.order.filter(id => g.st[id]);
    const humans = ids.filter(id => !isBot(room, id));
    function top(arr, f, min) {
      let best = null, bv = -Infinity;
      arr.forEach(id => { const v = f(id); if (v > bv) { bv = v; best = [id]; } else if (v === bv && best) best.push(id); });
      return best && bv >= min ? { ids: best, v: bv } : null;
    }
    return {
      sponge: top(humans, id => g.tab[id].total, 1),
      bund: top(humans, id => g.tab[id].bunds, 1),
      sharp: top(ids.filter(id => g.st[id].sq >= 3), id => g.st[id].hit / g.st[id].sq, 0.0001),
      fisher: top(ids, id => g.st[id].water, 1),
      scrap: top(ids, id => g.st[id].earned, 1)
    };
  }

  const E = {
    FLEET, PRICE, GADGETS, R, CARDS, ROUND_CARDS, COLORS, CLOCKS, SHIP_NAMES, BOT_NAMES,
    newRoom, apply, tick, seatOf, isBot, adminId, afloat, live, ownCells, wxActive, priceOf,
    shipCells, around, block, line, validShip, validFleet, titles, clean,
    _: { rnd, shuffle, randomFleet, strike, doGadget, doAttack, holdTurn, botGadget, botAttack, botView, initBotMem, autoGive, finishGame, newRound, collide, checkEnd, startTurn }
  };

  else root.SoslagEngine = E;
})(typeof self !== 'undefined' ? self : this);

/* Søslag sound: everything is synthesized with WebAudio, so the file carries no audio. */
(function (root) {
  'use strict';

  function unlock() {
    if (!ctx) {
      const AC = root.AudioContext || root.webkitAudioContext;

      master = ctx.createGain();
      master.gain.value = 0.7;
      master.connect(ctx.destination);
      const len = ctx.sampleRate * 2;
      noise = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = noise.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ctx.state === 'suspended') ctx.resume();
  }

  function env(g, t0, a, peak, hold, rel) {
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + a);
    g.gain.setValueAtTime(peak, t0 + a + hold);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + a + hold + rel);
  }
  function osc(type, f0, f1, t0, dur, peak, dest) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t0);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
    env(g, t0, 0.008, peak, 0, dur);
    o.connect(g); g.connect(dest || master);

  }
  function burst(t0, dur, type, f0, f1, peak, q) {
    const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = noise;
    f.type = type; f.Q.value = q || 0.8;
    f.frequency.setValueAtTime(f0, t0);
    f.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
    env(g, t0, 0.01, peak, 0, dur);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(t0, Math.random()); s.stop(t0 + dur + 0.05);
  }

  const SFX = {
    fire(t) { osc('sine', 140, 38, t, 0.32, 0.9); burst(t, 0.12, 'highpass', 1800, 900, 0.25); },
    splash(t) { burst(t, 0.7, 'bandpass', 1400, 260, 0.6, 0.7); burst(t + 0.05, 0.4, 'highpass', 3000, 1500, 0.12); },
    boom(t) { burst(t, 1.3, 'lowpass', 900, 70, 1.0, 0.6); osc('sine', 80, 32, t, 0.9, 0.9); },
    sink(t) {
      SFX.boom(t);
      const o = ctx.createOscillator(), f = ctx.createBiquadFilter(), g = ctx.createGain();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(190, t + 0.3); o.frequency.exponentialRampToValueAtTime(48, t + 2.1);
      f.type = 'lowpass'; f.frequency.value = 420;
      env(g, t + 0.3, 0.2, 0.22, 0.8, 0.9);
      o.connect(f); f.connect(g); g.connect(master);
      o.start(t + 0.3); o.stop(t + 2.4);
    },
    ping(t) {
      osc('sine', 1320, 1300, t, 0.7, 0.35);
      osc('sine', 1320, 1300, t + 0.42, 0.6, 0.12);
      osc('sine', 1320, 1300, t + 0.84, 0.5, 0.05);
    },
    mine(t) { SFX.boom(t); SFX.boom(t + 0.18); },
    torpedo(t) { burst(t, 1.0, 'bandpass', 260, 1600, 0.55, 1.2); },
    horn(t) {
      const f = ctx.createBiquadFilter(), g = ctx.createGain();
      f.type = 'lowpass'; f.frequency.value = 380;
      env(g, t, 0.18, 0.5, 1.2, 0.6);
      [98, 98.8, 147].forEach((hz, i) => {
        const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = hz;
        const og = ctx.createGain(); og.gain.value = i === 2 ? 0.25 : 0.6;
        o.connect(og); og.connect(f); o.start(t); o.stop(t + 2.1);
      });
      f.connect(g); g.connect(master);
    },
    klaxon(t) {
      for (let i = 0; i < 6; i++) osc('square', i % 2 ? 880 : 660, i % 2 ? 880 : 660, t + i * 0.2, 0.18, 0.18);

    sip(t) { osc('sine', 880, 1320, t, 0.14, 0.3); },
    turn(t) { osc('triangle', 660, 660, t, 0.22, 0.35); osc('triangle', 990, 990, t + 0.14, 0.32, 0.35); },
    tick(t) { osc('square', 2200, 2200, t, 0.03, 0.08); },

  class Session {

        if (st.epoch < cur.epoch) return;
        if (st.epoch === cur.epoch && st.host === cur.host && st.rev <= cur.rev) return;

    startLoops() {
      this.timers.push(setInterval(() => this.loop(), 250));
      if (!this.local) {

      }
    }

    loop() {
      if (this.stopped || !this.room) return;
      const now = Date.now();
      if (this.isHost) {
        const r = E.tick(this.room, now);
        if (r.fx.length) { this.pendingFx.push(...r.fx); this.schedulePublish(); }
        r.aims.forEach(a => this.sendAim(a));

        if (!this.local && now - (this._lastHostBeat || 0) > 2500) { this._lastHostBeat = now; }
      } else if (!this.local && this.role === 'player') {

    }

    refreshOnline() {
      const room = this.room; if (!room || !this.isHost) return;
      const now = Date.now();

      for (const s of room.seats) {
        if (s.kind !== 'human') continue;

      }

    }

    maybeTakeOver(now) {
      const room = this.room;
      if (!room || !this.mq || !this.mq.open || this.status !== 'online') return;
      if (now - this.connectedAt < 6000) return;
      if (!room.seats.some(s => s.id === this.me && !s.removed)) return;

        (s.id === this.me || (this.hb[s.id] && now - this.hb[s.id] < 8000))).map(s => s.id);
      const rank = cands.indexOf(this.me);

    }

    takeOver() {
      const room = this.room;
      this.isHost = true;
      room.epoch += 1;
      room.host = this.me;
      room.online[this.me] = true;
      // the old host's phone counts as offline until it beats again
      this.refreshOnline();
      // restart any bot turn so it isn't stuck mid-aim
      if (room.g && room.g.turn && room.g.turn.bot) room.g.turn.bot = { stage: 0, at: Date.now() + 800 };
      this.pendingFx.push({ t: 'host', id: this.me });

    /* intents */
    send(intent) {

<script>
/* Søslag interface: screens, the ocean, animations and input. */
(function () {
  'use strict';
  const E = window.SoslagEngine, N = window.SoslagNet, X = window.SoslagText, S = window.SoslagSound;
  const t = X.t;

  /* ---------- small helpers ---------- */
  const COLORS = [
    ['#ff5d5d', 'Rød', 'Red'], ['#4f8dff', 'Blå', 'Blue'], ['#46d483', 'Grøn', 'Green'], ['#b07cff', 'Lilla', 'Purple'],
    ['#ff73c4', 'Pink', 'Pink'], ['#e9f1f5', 'Hvid', 'White'], ['#c8e04a', 'Lime', 'Lime'], ['#c9a27e', 'Sand', 'Sand']

  const hex = i => (COLORS[i] || COLORS[0])[0];
  const LETTERS = 'ABCDEFGHIJKL';
  const coord = (n, c) => LETTERS[c % n] + (Math.floor(c / n) + 1);

  function h(tag, props) {
    const el = document.createElement(tag);

      for (const k in props) {
        let v = props[k];
        if (k === 'disabled' || k === 'hidden' || k === 'checked') v = !!v;
        if (v == null || v === false) continue;
        if (k === 'class') el.className = v;
        else if (k === 'style') { for (const sk in v) { if (sk.startsWith('--')) el.style.setProperty(sk, v[sk]); else el.style[sk] = v[sk]; } }
        else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);

        else if (k === 'svg') el.innerHTML = v;

  }
  function add(el, kid) {

  const store = {
    get(k, d) { try { const v = localStorage.getItem('soslag.' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('soslag.' + k, JSON.stringify(v)); } catch (e) {} }

  function randomShips() { return E.FLEET.map(L => E.SHIP_NAMES[L][Math.floor(Math.random() * E.SHIP_NAMES[L].length)]); }

  /* ---------- app state ---------- */
  const App = {
    profile: Object.assign({ name: '', color: Math.floor(Math.random() * 8), ships: randomShips(), lang: 'da', mute: false }, store.get('profile', {})),
    sess: null, room: null, shown: null, myId: null, mode: null,
    screen: null, screenKey: '', status: 'idle',
    fxQ: [], animating: false, board: null,

  const view = () => App.shown || App.room;

  function nameOf(room, id) {

  function setUrl(code, b, table) {
    try {
      const u = new URL(location.href);

  /* ---------- sessions ---------- */

    App.fxQ = []; App.animating = false; App.screenKey = '';

  }

  async function createRoom() {
    if (!N.cryptoOk()) return showError(t('insecure'));
    resetRoom();
    showConnecting(t('connecting'));
    const myId = N.randomId('p');
    const sess = makeSession({ code: N.randomCode(), me: myId, brokerIndex: 0 });
    App.sess = sess; App.myId = myId; App.mode = 'online';

  async function joinRoom(code, b) {
    if (!N.cryptoOk()) return showError(t('insecure'));

  async function startPractice(bots) {

  /* radar sweep on the home screen */
  let radarRaf = 0;
  function startRadar(cv) {
    cancelAnimationFrame(radarRaf);
    const ctx = cv.getContext('2d');
    const blips = [];
    let last = performance.now(), ang = -Math.PI / 2;
    function frame(now) {
      if (!cv.isConnected) return;
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      const w = cv.clientWidth, hh = cv.clientHeight;
      if (cv.width !== Math.round(w * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(hh * dpr); }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const dt = Math.min(0.1, (now - last) / 1000); last = now;
      if (!reduced()) ang += dt * 1.15;
      const cx = w / 2, cy = hh * 0.52, R = Math.max(w, hh) * 0.62;
      ctx.clearRect(0, 0, w, hh);
      ctx.strokeStyle = 'rgba(63,214,204,0.13)'; ctx.lineWidth = 1;
      for (let r = R / 5; r <= R; r += R / 5) { ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke(); }
      ctx.beginPath(); ctx.moveTo(cx - R, cy); ctx.lineTo(cx + R, cy); ctx.moveTo(cx, cy - R); ctx.lineTo(cx, cy + R); ctx.stroke();
      const sweep = 0.9;
      for (let i = 0; i < 24; i++) {
        const a0 = ang - sweep * (i / 24), a1 = ang - sweep * ((i + 1) / 24);
        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, R, a1, a0); ctx.closePath();
        ctx.fillStyle = 'rgba(63,214,204,' + (0.16 * (1 - i / 24)) + ')'; ctx.fill();
      }
      ctx.strokeStyle = 'rgba(120,240,230,0.55)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(ang) * R, cy + Math.sin(ang) * R); ctx.stroke();
      if (Math.random() < dt * 1.6) {
        const r = R * (0.2 + Math.random() * 0.7);
        blips.push({ x: cx + Math.cos(ang) * r, y: cy + Math.sin(ang) * r, life: 1, amber: Math.random() < 0.25 });
      }
      for (let i = blips.length - 1; i >= 0; i--) {
        const b = blips[i]; b.life -= dt * 0.45;
        if (b.life <= 0) { blips.splice(i, 1); continue; }
        ctx.fillStyle = b.amber ? 'rgba(255,179,71,' + b.life + ')' : 'rgba(150,250,240,' + b.life + ')';
        ctx.beginPath(); ctx.arc(b.x, b.y, 2.6, 0, Math.PI * 2); ctx.fill();
      }
      if (!reduced()) radarRaf = requestAnimationFrame(frame);
    }
    radarRaf = requestAnimationFrame(frame);
  }

  /* ---------- effects ---------- */
  function playFx(fx, room, fast) {
    if (!fx || !fx.length) return 0;
    const my = me(), table = App.mode === 'table';
    let at = 0;

    const boardOn = App.board && (App.screen === 'battle' || App.screen === 'table');
    const g = room.g;

      const concernsMe = d => d && d.some(x => x.id === my && (x.n > 0 || x.why === 'bund'));
      switch (ev.t) {
        case 'atk': {
          if (fast) break;
          const t0 = at;
          const mineShooter = ev.by === my;
          const owners = new Set(); ev.sq.forEach(q => q.ships.forEach(x => owners.add(x[0])));
          const hear = table || mineShooter || owners.has(my);
          if (ev.w === 'torpedo') {
            if (hear || true) later(t0, () => S.play('torpedo'));
            if (boardOn) later(t0, () => fxTorpedo(ev, room));
            ev.sq.forEach((q, k) => later(t0 + 250 + k * 110, () => { if (boardOn) (q.ships.length ? fxBoom(q.c) : fxSplash(q.c)); if (hear && q.ships.length) S.play('boom'); }));
            at += 900 + ev.sq.length * 110;
          } else if (ev.w === 'depth') {
            if (boardOn) later(t0, () => fxDepth(ev));
            if (hear) later(t0 + 250, () => S.play(ev.sq.some(q => q.ships.length) ? 'boom' : 'splash'));
            ev.sq.forEach((q, k) => later(t0 + 300 + k * 90, () => { if (boardOn) (q.ships.length ? fxBoom(q.c) : fxSplash(q.c)); }));
            at += 1100;
          } else {
            if (boardOn) later(t0, () => fxIncoming(ev.c));
            const hit = ev.sq.some(q => q.ships.length);
            later(t0 + 380, () => { if (boardOn) (hit ? fxBoom(ev.c) : fxSplash(ev.c)); if (hear) S.play(hit ? 'boom' : 'splash'); });
            at += 950;
          }
          if (ev.mines && ev.mines.length) { const tm = at; ev.mines.forEach(m => later(tm, () => { if (boardOn) fxMine(m.c, colorOf(room, m.by)); if (table || mineShooter || m.by === my) S.play('mine'); })); at += 700; }
          if (ev.sinks && ev.sinks.length) {
            const tm = at;
            ev.sinks.forEach((x, k) => later(tm + k * 500, () => {
              const sh = g.fleets[x[0]][x[1]];
              bigToast(t('e_sunk', { ship: sh.name }), nameOf(room, x[0]), colorOf(room, x[0]));
              if (table || x[0] === my || mineShooter) S.play('sink');
            }));
            at += 1500 + (ev.sinks.length - 1) * 500;
          }
          if (ev.bund) { const tm = at; later(tm, () => overlayBund(nameOf(room, ev.by), colorOf(room, ev.by), ev.by === my)); at += 2700; }
          break;
        }
        case 'col': {
          if (fast) break;
          const tm = at;
          later(tm, () => { if (boardOn) fxCollision(ev.c, ev.ships.map(x => colorOf(room, x[0]))); if (table || ev.ships.some(x => x[0] === my)) S.play('boom'); });
          later(tm + 200, () => bigToast(t(ev.launch ? 'e_colLaunch' : 'e_col', { at: coord(g.n, ev.c) }), ev.ships.map(x => nameOf(room, x[0])).join(' × '), '#ff8a3c'));
          at += 1500;
          break;
        }
        case 'sonar': {
          if (ev.by === my) { App.ui.sonar = { c: ev.c, n: ev.n, until: Date.now() + 60000, nr: room.g.turn ? room.g.turn.nr : 0 }; S.play('ping'); }
          else if (table) S.play('ping');
          if (!fast && boardOn) { const tm = at; later(tm, () => fxPing(ev.c, room.g.n)); at += 700; }
          break;
        }
        case 'chart': if (ev.by === my) { App.ui.peek = Date.now() + 3000; S.play('ping'); setTimeout(() => { if (App.screen === 'battle') paintBoard(); }, 3100); } break;
        case 'mine':
          if (ev.by !== my && !fast) toast(t('e_mine', { by: nameOf(room, ev.by) }));
          else if (ev.by === my) { S.play('tick'); if (boardOn && Number.isInteger(ev.c)) fxMineLaid(ev.c); }
          break;
        case 'hold': if (!fast) toast(describe(ev, room).join(' · ')); break;
        case 'ghost': if (!fast) { const tm = at; later(tm, () => toast(t('e_ghost', { name: nameOf(room, ev.id) }), 'alt')); at += 400; } break;
        case 'wx': {
          const tm = at;
          later(tm, () => { overlayWeather(ev.card); S.play('horn'); });
          at += fast ? 0 : 2300;
          if (ev.card === 'lyn' && Number.isInteger(ev.c)) {
            const t2 = at;
            later(t2, () => { if (boardOn) fxLightning(ev.c, room.g.n, ev.ships && ev.ships.length); S.play('lightning'); });
            at += fast ? 0 : 900;
          }
          if (ev.card === 'blus' && ev.flares && ev.flares[my] != null) App.ui.flare = { c: ev.flares[my], until: Date.now() + at + 4500 };
          break;
        }
        case 'fc': if (!fast) toast(t('e_fc', { card: t('w_' + ev.card) }), 'fc'); break;
        case 'win': {

        case 'refused': if (ev.to === my) toast(refuseText(ev.err), 'warn'); break;
        case 'host': toast(t('e_host', { name: nameOf(room, ev.id) })); break;
        case 'give': if (ev.to === my) { S.play('sip'); S.buzz([60, 40, 60]); } break;
        case 'scuttle': toast(t('e_scuttle', { name: nameOf(room, ev.id) })); break;
        default: break;
      }
      if (concernsMe(ev.dr) && !table) {

    fxAnim(svgEl('circle', { cx: x, cy: y, r: 0.2, fill: 'none', stroke: '#ff8a3c', 'stroke-width': 0.1 }), [{ r: 0.2, opacity: 1 }, { r: 1.25, opacity: 0 }], 700);

  function fxTorpedo(ev, room) {

    const [x1, y1] = ev.axis === 'r' ? [0, ev.i + 0.5] : [ev.i + 0.5, 0];

      const d = +el.dataset.deadline;

      const total = (room && room.settings.clock ? room.settings.clock : 30) * 1000;
      if (el.tagName === 'I') { el.style.width = Math.max(0, Math.min(100, rem / total * 100)) + '%'; el.parentElement.classList.toggle('low', rem < 6000); }
      else el.textContent = Math.ceil(rem / 1000) + 's';

      const rem = Math.max(0, +el.dataset.ends - now);
      el.textContent = el.id === 'lookCount' ? String(Math.ceil(rem / 1000)) : fmtClock(rem);
    });
    // last seconds of my turn tick

      const rem = room.g.turn.deadline - now;
